services:
  eclipsejdtls:
    image: ghcr.io/typefox/monaco-languageclient/eclipse.jdt.ls:latest
    platform: linux/amd64
    pull_policy: never
    tty: true
    user: ubuntu
    command: ['bash', '-c', '/home/ubuntu/.local/bin/mise exec -- npm run start:example:server:jdtls']
    ports:
      - 30003:30003
    working_dir: /home/ubuntu/mlc
    container_name: eclipsejdtls
